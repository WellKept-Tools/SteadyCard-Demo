/* Module partagé « diary_card » (WA-003, réutilisé tel quel par WA-009) :
   calculs (§6.1 à §6.4), carte du jour (O1, O10, O11), grille de la semaine et impression (O2), personnalisation (O5).
   État attendu : cards {iso: card}, emotionDefs, urgeDefs, skills {id: {favorite, tracked, practice, myExample}},
   settings.weekStart (0 = lundi … 6 = dimanche), settings.sessionDay ; WK.cfg.skills [{id, module}], WK.cfg.modules.
   Textes : clés card.*, week.*, prep.*, settings.*, yesterday, plan.here ; libellés par défaut et compétences : WK.pack.content.library. */
(function () {
  'use strict';
  const WK = window.WK, h = WK.h;
  const DC = (WK.dc = {});
  const lib = () => WK.pack.content.library;
  const MAX_DEFS = 8;

  /* ---------- définitions (émotions, envies, compétences) ---------- */
  DC.defs = (kind, all) => (WK.state[kind === 'emo' ? 'emotionDefs' : 'urgeDefs'] || []).slice().sort((a, b) => a.order - b.order).filter((d) => all || !d.hidden);
  DC.label = (d, kind) => {
    if (d.label) return d.label;
    const x = (lib()[kind === 'emo' ? 'emotions' : 'urges'] || []).find((e) => e.id === d.id);
    return x ? x.label : d.id;
  };
  DC.skill = (id) => (lib().skills || []).find((s) => s.id === id) || { id, name: id, module: '' };
  DC.skillName = (id) => DC.skill(id).name;
  DC.moduleOf = (id) => ((WK.cfg.skills || []).find((s) => s.id === id) || {}).module || DC.skill(id).module;
  DC.moduleName = (m) => ((lib().modules || []).find((x) => x.id === m) || {}).name || m;
  DC.sk = (id) => (WK.state.skills && WK.state.skills[id]) || {};
  DC.skillIds = () => (WK.cfg.skills || []).map((s) => s.id);
  DC.cardSkills = (quick) => {
    const ids = DC.skillIds().filter((id) => DC.sk(id).tracked !== false);
    const fav = ids.filter((id) => DC.sk(id).favorite);
    if (quick) return fav.slice(0, 3);
    return fav.concat(ids.filter((id) => !DC.sk(id).favorite));
  };

  /* ---------- semaines ---------- */
  DC.weekStartOf = (iso) => {
    const ws = (WK.state.settings && WK.state.settings.weekStart) || 0;
    const dow = (WK.parse(iso).getDay() + 6) % 7; /* 0 = lundi */
    return WK.addDays(iso, -((dow - ws + 7) % 7));
  };
  DC.days = (start) => [0, 1, 2, 3, 4, 5, 6].map((i) => WK.addDays(start, i));
  DC.card = (iso) => (WK.state.cards || {})[iso] || null;

  /* ---------- calculs (§6.2, §6.3) : moyennes au dixième, jours vides ignorés ---------- */
  DC.avg = (vals) => (vals.length ? Math.round((vals.reduce((a, b) => a + b, 0) * 10) / vals.length) / 10 : null);
  DC.score = (c) => DC.defs('emo', true).filter((d) => !d.positive).reduce((a, d) => a + (Number(c.emotions && c.emotions[d.id]) || 0), 0)
    + DC.defs('urge', true).reduce((a, d) => a + (Number(c.urges && c.urges[d.id]) || 0), 0);
  DC.top = (counts, n) => Object.entries(counts).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)).slice(0, n || 3);
  DC.stats = (dates) => {
    const filled = dates.filter((d) => DC.card(d));
    const out = { filled: filled.length, dates: filled, emo: {}, urge: {}, uses: 0, distinct: 0, modules: {}, counts: {}, sleep: null, hardest: null, flagged: [] };
    const series = (kind, key) => DC.defs(kind, true).forEach((d) => {
      const vals = filled.map((x) => DC.card(x)[key]).filter((o) => o && o[d.id] != null).map((o) => Number(o[d.id]));
      out[kind][d.id] = { avg: DC.avg(vals), max: vals.length ? Math.max(...vals) : null };
    });
    series('emo', 'emotions'); series('urge', 'urges');
    filled.forEach((d) => (DC.card(d).skills || []).forEach((id) => { out.counts[id] = (out.counts[id] || 0) + 1; const m = DC.moduleOf(id); out.modules[m] = (out.modules[m] || 0) + 1; }));
    out.uses = Object.values(out.counts).reduce((a, b) => a + b, 0);
    out.distinct = Object.keys(out.counts).length;
    out.top = DC.top(out.counts, 3);
    const sl = filled.map((d) => DC.card(d).sleep).filter((v) => v != null && v !== '').map(Number);
    out.sleep = DC.avg(sl);
    filled.forEach((d) => { const sc = DC.score(DC.card(d)); if (!out.hardest || sc > out.hardest.score || (sc === out.hardest.score && d > out.hardest.date)) out.hardest = { date: d, score: sc }; });
    out.flagged = filled.filter((d) => DC.card(d).flag);
    return out;
  };
  DC.weekStats = (start) => DC.stats(DC.days(start).filter((d) => d <= WK.today()));
  /* Tendances : les n×7 derniers jours et la semaine en cours, regroupés par semaine (lecture fixée par wa003_demo.py). */
  DC.trends = (weeks) => {
    const today = WK.today(), first = WK.addDays(today, -weeks * 7), rows = [];
    for (let ws = DC.weekStartOf(first); ws <= today; ws = WK.addDays(ws, 7)) {
      const st = DC.stats(DC.days(ws).filter((d) => d >= first && d <= today));
      rows.push({ week: ws, stats: st });
    }
    return rows;
  };
  DC.filledSince = (n) => { let c = 0; for (let i = 1; i <= n; i++) if (DC.card(WK.addDays(WK.today(), -i))) c++; return c; };
  DC.fmt1 = (v) => (v == null ? '–' : WK.num(v, { minimumFractionDigits: 1, maximumFractionDigits: 1 }));
  DC.level = (v) => (v == null || v === '' ? 'none' : String(Math.max(0, Math.min(5, Math.round(Number(v))))));

  /* ---------- carte du jour ---------- */
  let draft = null, draftDay = null, editing = null, saved = null;
  const blankCard = () => ({ emotions: {}, urges: {}, acted: {}, skills: [], helped: null, sleep: null, note: '', flag: false });
  function startDraft(day) {
    draftDay = day;
    draft = WK.clone(DC.card(day) || blankCard());
    DC.defs('emo').forEach((d) => { if (draft.emotions[d.id] == null) draft.emotions[d.id] = 0; });
    DC.defs('urge').forEach((d) => { if (draft.urges[d.id] == null) draft.urges[d.id] = 0; if (draft.acted[d.id] == null) draft.acted[d.id] = false; });
  }
  DC.resetDraft = () => { draft = null; draftDay = null; editing = null; };
  DC.minDay = () => WK.addDays(WK.today(), -7);

  function slider(label, value, onInput, test) {
    const out = h('output.slider-val.tnum', { 'data-test': test + '-val' }, String(value));
    const input = h('input.slider', { type: 'range', min: 0, max: 5, step: 1, value, 'aria-label': label, 'data-test': test, style: { '--v': value },
      oninput: (e) => { const v = Number(e.target.value); out.textContent = String(v); e.target.style.setProperty('--v', v); onInput(v); } });
    return h('div.slider-row', h('label.slider-label', h('span', label), out), input, h('div.slider-ticks', { 'aria-hidden': 'true' }, [0, 1, 2, 3, 4, 5].map((i) => h('span', String(i)))));
  }
  function yesNo(on, onChange, test) {
    return WK.segmented([{ value: false, label: WK.t('card.no') }, { value: true, label: WK.t('card.yes') }], !!on, (v) => { onChange(v); }, WK.t('card.acted'));
  }
  function skillChip(id, on, toggle) {
    return h('button.chip.skill-chip' + (on ? '.on' : ''), { type: 'button', 'aria-pressed': String(on), 'data-skill': id, onclick: (e) => { const b = e.currentTarget; const v = !b.classList.contains('on'); b.classList.toggle('on', v); b.setAttribute('aria-pressed', String(v)); toggle(v); } },
      DC.sk(id).favorite ? WK.icon('star', 'chip-star') : null, h('span', DC.skillName(id)));
  }

  function cardForm(day) {
    if (draftDay !== day || !draft) startDraft(day);
    const s = WK.state, quick = !!(s.ui && s.ui.quick);
    const wrap = h('div.card-form', { 'data-test': 'card-form' });
    const part = (i, n, title, ...kids) => h('section.card.form-part', h('p.eyebrow', WK.t('card.step', { i, n })), h('h2', title), kids);
    const n = quick ? 2 : 4;
    wrap.append(part(1, n, WK.t('card.emotions'), h('p.muted.small', WK.t('card.scale')),
      DC.defs('emo').map((d) => slider(DC.label(d, 'emo'), draft.emotions[d.id] || 0, (v) => { draft.emotions[d.id] = v; }, 'emo-' + d.id)),
      h('h3.form-sub', WK.t('card.urges')),
      DC.defs('urge').map((d) => h('div.urge-block', slider(DC.label(d, 'urge'), draft.urges[d.id] || 0, (v) => { draft.urges[d.id] = v; }, 'urge-' + d.id),
        quick ? null : h('div.acted-row', { 'data-test': 'acted-' + d.id }, h('span.muted', WK.t('card.acted')),
          (() => { const seg = yesNo(draft.acted[d.id], (v) => { draft.acted[d.id] = v; seg.querySelectorAll('button').forEach((b) => { const on = b.dataset.value === String(v); b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); }); }); return seg; })())))));
    const groups = quick ? [{ m: null, ids: DC.cardSkills(true) }] : (WK.cfg.modules || []).map((m) => ({ m, ids: DC.cardSkills(false).filter((id) => DC.moduleOf(id) === m) }));
    const toggle = (id) => (v) => { const set = new Set(draft.skills); v ? set.add(id) : set.delete(id); draft.skills = DC.skillIds().filter((x) => set.has(x)); };
    const helpedSeg = WK.segmented([0, 1, 2, 3].map((i) => ({ value: i, label: i + ' · ' + WK.t('card.helped' + i) })), draft.helped, (v) => {
      draft.helped = v; helpedSeg.querySelectorAll('button').forEach((b) => { const on = b.dataset.value === String(v); b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
    }, WK.t('card.helped'));
    helpedSeg.classList.add('helped-seg'); helpedSeg.dataset.test = 'helped';
    wrap.append(part(2, n, WK.t('card.skills'),
      groups.map((g) => h('div.skill-group', g.m ? h('h3.form-sub', h('span.mod-dot.mod-' + g.m), DC.moduleName(g.m)) : null,
        h('div.chips', g.ids.map((id) => skillChip(id, draft.skills.includes(id), toggle(id)))))),
      h('h3.form-sub', WK.t('card.helped')), helpedSeg));
    if (!quick) {
      wrap.append(part(3, n, WK.t('card.sleep'),
        h('label.field.sleep-field', h('span', WK.t('card.sleep')), h('input.input', { type: 'number', min: 0, max: 14, step: 0.5, inputmode: 'decimal', value: draft.sleep == null ? '' : draft.sleep, 'data-test': 'sleep',
          oninput: (e) => { const v = e.target.value === '' ? null : Math.max(0, Math.min(14, Math.round(Number(e.target.value) * 2) / 2)); draft.sleep = isFinite(v) ? v : null; } }))));
    }
    wrap.append(part(quick ? 2 : 4, n, WK.t('card.note'),
      h('textarea.input', { rows: 2, placeholder: WK.t('card.notePh'), 'aria-label': WK.t('card.note'), 'data-test': 'note', oninput: (e) => { draft.note = e.target.value; } }, draft.note || ''),
      h('label.check.flag-check', h('input', { type: 'checkbox', checked: draft.flag ? true : null, 'data-test': 'flag', onchange: (e) => { draft.flag = e.target.checked; } }), h('span', WK.t('card.flag'))),
      h('div.btn-row.save-row', WK.btn(WK.t('card.save'), () => DC.save(day), { kind: 'primary', icon: 'tick', test: 'save' }))));
    return wrap;
  }

  DC.save = (day) => {
    const c = WK.clone(draft);
    c.note = (c.note || '').trim();
    WK.update((s) => { s.cards = s.cards || {}; s.cards[day] = c; });
    saved = day; DC.resetDraft();
    WK.sound('ok');
    WK.refresh();
  };

  function summary(day) {
    const c = DC.card(day), n = (c.skills || []).length;
    const settle = saved === day && document.documentElement.dataset.motion !== 'minimal';
    saved = null;
    const box = h('section.card.card-summary' + (settle ? '.settle' : ''), { 'data-test': 'card-summary' },
      h('div.card-head', h('h2', { 'data-test': 'saved-text' }, WK.icon('tick'), h('span', WK.t('card.saved', { n }))),
        WK.btn(WK.t('card.edit'), () => { editing = day; startDraft(day); WK.refresh(); }, { kind: 'ghost', icon: 'edit', test: 'edit-card' })),
      h('div.sum-grid',
        DC.defs('emo').map((d) => h('div.sum-cell', h('span.sum-name', DC.label(d, 'emo')), h('span.lv.lv-' + DC.level(c.emotions && c.emotions[d.id]) + '.tnum', String(c.emotions && c.emotions[d.id] != null ? c.emotions[d.id] : '–')))),
        DC.defs('urge').map((d) => h('div.sum-cell', h('span.sum-name', DC.label(d, 'urge')), h('span.lv.lv-' + DC.level(c.urges && c.urges[d.id]) + '.tnum', String(c.urges && c.urges[d.id] != null ? c.urges[d.id] : '–'))))),
      n ? h('p.sum-skills', (c.skills || []).map((id) => WK.pill(DC.skillName(id), 'accent'))) : h('p.muted', WK.t('card.noSkills')),
      c.note ? h('p.sum-note', c.note) : null,
      c.flag ? h('p.sum-flag', WK.icon('note'), WK.t('card.flagged')) : null);
    return box;
  }

  /* Écran Today : #/today[/AAAA-MM-JJ] */
  DC.renderToday = (view, args) => {
    const today = WK.today();
    let day = args && args[0] && /^\d{4}-\d{2}-\d{2}$/.test(args[0]) ? args[0] : today;
    if (day > today) day = today;
    if (day < DC.minDay()) day = DC.minDay();
    const s = WK.state, c = DC.card(day);
    view.append(h('header.page-head.today-head',
      h('div', h('p.eyebrow', { 'data-test': 'today-date' }, WK.icon('calendar'), WK.fmtDate(day, 'long')), h('h1', day === today ? WK.t('today.question') : WK.t('card.title'))),
      h('div.day-nav',
        h('button.icon-btn', { type: 'button', 'aria-label': WK.t('card.prevDay'), disabled: day <= DC.minDay() ? true : null, 'data-test': 'prev-day', onclick: () => { DC.resetDraft(); WK.go('today', WK.addDays(day, -1)); } }, WK.icon('back')),
        day !== today ? WK.btn(WK.t('card.backToday'), () => { DC.resetDraft(); WK.go('today'); }, { kind: 'ghost', test: 'back-today' }) : null,
        h('button.icon-btn', { type: 'button', 'aria-label': WK.t('card.nextDay'), disabled: day >= today ? true : null, 'data-test': 'next-day', onclick: () => { DC.resetDraft(); WK.go('today', WK.addDays(day, 1)); } }, WK.icon('chevron')))));
    if (WK.dc.beforeToday) WK.dc.beforeToday(view, day);
    const y = WK.addDays(today, -1);
    if (day === today && !DC.card(y) && (s.createdAt || today) <= y) {
      view.append(h('div.card.yesterday', { 'data-test': 'yesterday' }, WK.icon('note'), h('span', WK.t('yesterday')),
        WK.btn(WK.t('card.fillYesterday'), () => { DC.resetDraft(); WK.go('today', y); }, { kind: 'ghost', test: 'fill-yesterday' })));
    }
    if (c && editing !== day) {
      view.append(summary(day));
      const high = DC.defs('urge').some((d) => Number(c.urges && c.urges[d.id]) >= 4);
      if (high) view.append(h('a.card.plan-here', { href: WK.href('plan'), 'data-test': 'plan-here' }, WK.icon('heart'), h('span', WK.t('plan.here')), h('span.plan-here-go', WK.t('plan.open'), WK.icon('chevron'))));
      view.append(h('p.muted.filled-28.tnum', { 'data-test': 'filled-28' }, WK.t('today.filledDays', { n: DC.filledSince(28) })));
    } else {
      const quick = !!(s.ui && s.ui.quick);
      view.append(h('div.quick-row', h('label.check.quick-check', h('input', { type: 'checkbox', checked: quick ? true : null, 'data-test': 'quick', onchange: (e) => { const v = e.target.checked; WK.update((st) => { st.ui = Object.assign({}, st.ui, { quick: v }); }); } }),
        h('span', WK.t('card.quick'), h('small.muted', ' · ' + WK.t('card.quickHint'))))));
      view.append(cardForm(day));
    }
  };

  /* ---------- grille de la semaine (O2) ---------- */
  DC.rows = (start) => {
    const days = DC.days(start), today = WK.today();
    const rows = [];
    DC.defs('emo').forEach((d) => rows.push({ kind: 'emo', id: d.id, label: DC.label(d, 'emo'), cells: days.map((x) => { const c = DC.card(x); return c && c.emotions && c.emotions[d.id] != null ? c.emotions[d.id] : null; }) }));
    DC.defs('urge').forEach((d) => rows.push({ kind: 'urge', id: d.id, label: DC.label(d, 'urge'), cells: days.map((x) => { const c = DC.card(x); return c && c.urges && c.urges[d.id] != null ? c.urges[d.id] : null; }),
      acted: days.map((x) => { const c = DC.card(x); return !!(c && c.acted && c.acted[d.id]); }) }));
    rows.push({ kind: 'skills', id: 'skills', label: WK.t('week.skillsRow'), cells: days.map((x) => { const c = DC.card(x); return c ? (c.skills || []).length : null; }), names: days.map((x) => { const c = DC.card(x); return c ? (c.skills || []).map(DC.skillName) : []; }) });
    rows.push({ kind: 'helped', id: 'helped', label: WK.t('week.helped'), cells: days.map((x) => { const c = DC.card(x); return c && c.helped != null ? c.helped : null; }) });
    rows.push({ kind: 'sleep', id: 'sleep', label: WK.t('week.sleep'), cells: days.map((x) => { const c = DC.card(x); return c && c.sleep != null ? c.sleep : null; }) });
    return { days, rows, future: days.map((x) => x > today) };
  };
  const dayHead = (iso) => {
    const d = WK.parse(iso);
    return [new Intl.DateTimeFormat(WK.locale, { weekday: 'short' }).format(d), new Intl.DateTimeFormat(WK.locale, { day: 'numeric' }).format(d)];
  };
  DC.grid = (start) => {
    const g = DC.rows(start);
    const fmt = (r, v) => (v == null ? '–' : r.kind === 'sleep' ? WK.num(v, { maximumFractionDigits: 1 }) : String(v));
    const table = h('table.week-grid', { 'data-test': 'week-grid' },
      h('thead', h('tr', h('th', { scope: 'col' }, h('span.sr', WK.t('week.card'))), g.days.map((x, i) => { const [w, n] = dayHead(x); return h('th', { scope: 'col', class: 'col-' + i + (x === WK.today() ? ' is-today' : ''), 'data-day': x }, h('span.wd', w), h('span.dn.tnum', n)); }))),
      h('tbody', g.rows.map((r) => h('tr.row-' + r.kind, { 'data-row': r.id },
        h('th', { scope: 'row' }, r.label),
        r.cells.map((v, i) => h('td', { class: 'col-' + i + ((r.kind === 'emo' || r.kind === 'urge') ? ' lv lv-' + DC.level(v) : '') + (g.future[i] ? ' future' : ''), 'data-day': g.days[i], 'data-row': r.id, title: r.names && r.names[i].length ? r.names[i].join(', ') : null },
          h('span.tnum', fmt(r, v)), r.acted && r.acted[i] ? h('span.acted-mark', { title: WK.t('week.acted'), 'aria-label': WK.t('week.acted') }, '•') : null))))));
    return table;
  };
  DC.printWeek = (start) => {
    const g = DC.rows(start), s = WK.state.settings;
    const esc = WK.esc, fmt = (r, v) => (v == null ? '' : r.kind === 'sleep' ? WK.num(v, { maximumFractionDigits: 1 }) : String(v));
    const sessionDay = new Intl.DateTimeFormat(WK.locale, { weekday: 'long' }).format(WK.parse(WK.addDays('2027-01-04', s.sessionDay || 0)));
    const head = '<tr><th></th>' + g.days.map((x) => { const [w, n] = dayHead(x); return `<th>${esc(w)} ${esc(n)}</th>`; }).join('') + '</tr>';
    const body = g.rows.map((r) => `<tr class="p-${r.kind}"><th>${esc(r.label)}</th>` + r.cells.map((v, i) =>
      `<td class="${(r.kind === 'emo' || r.kind === 'urge') ? 'lv-' + DC.level(v) : ''}">${esc(fmt(r, v))}${r.acted && r.acted[i] ? ' •' : ''}</td>`).join('') + '</tr>').join('');
    const names = g.rows.find((r) => r.kind === 'skills').names;
    const skillsRow = '<tr class="p-names"><th>' + esc(WK.t('card.skills')) + '</th>' + names.map((n) => `<td>${esc(n.join(', '))}</td>`).join('') + '</tr>';
    const notes = g.days.map((x) => { const c = DC.card(x); return c && c.note ? `<li><strong>${esc(WK.fmtDate(x, 'day'))}</strong>${c.flag ? ' ★' : ''} ${esc(c.note)}</li>` : ''; }).join('');
    const html = `<div class="print-week"><div class="pw-head"><h1>${esc(WK.t('week.printTitle', { date: WK.fmtDate(start, 'medium') }))}</h1>` +
      `<p>${esc(WK.t('week.printName'))}: ____________________ · ${esc(WK.t('week.printSession', { day: sessionDay }))}</p></div>` +
      `<table class="pw-grid"><thead>${head}</thead><tbody>${body}${skillsRow}</tbody></table>` +
      `<p class="pw-legend">${esc(WK.t('card.scale'))} · • ${esc(WK.t('week.acted'))} · ★ ${esc(WK.t('card.flag'))}</p>` +
      (notes ? `<h2>${esc(WK.t('card.note'))}</h2><ul class="pw-notes">${notes}</ul>` : '') +
      `<p class="pw-foot">${esc(WK.cfg.title)} · WellKept Tools</p></div>`;
    const landscape = DC.defs('emo').length > 8 || DC.defs('urge').length > 8;
    return WK.printHTML(html, { kind: 'week', landscape });
  };

  /* ---------- personnalisation de la carte (O5) ---------- */
  DC.myCard = () => {
    const box = h('section.card.my-card', { 'data-test': 'my-card' }, h('h2', WK.t('settings.myCard')), h('p.muted', WK.t('settings.myCardHint')));
    [['emo', 'emotionDefs', 'settings.emotions', 'settings.addEmotion'], ['urge', 'urgeDefs', 'settings.urges', 'settings.addUrge']].forEach(([kind, key, title, add]) => {
      const all = DC.defs(kind, true);
      const move = (d, dir) => WK.update((s) => {

    let sessionDay = WK.state.settings.sessionDay;
    const head = (i, title, hint) => h('div.wiz-head', h('p.eyebrow', WK.t('wizard.stepOf', { i })), h('h3', title), h('p.muted', hint));
    const pick = (list, set) => h('div.wiz-defs', list.map((x) => h('label.check', h('input', { type: 'checkbox', checked: set.has(x.id) ? true : null, 'data-def': x.id, onchange: (e) => { e.target.checked ? set.add(x.id) : set.delete(x.id); } }), h('span', x.label))));
    const step1 = () => WK.modal({ title: WK.t('wizard.title'), wide: true, body: (el) => el.append(head(1, WK.t('wizard.step1'), WK.t('wizard.step1Hint')),
      h('h4', WK.t('card.emotions')), pick(L.emotions, keepE), h('h4', WK.t('card.urges')), pick(L.urges, keepU)),
    actions: [{ label: WK.t('shell.cancel') }, { label: WK.t('shell.next'), kind: 'primary', test: 'wizard-next', onClick: () => { if (!keepE.size) return false; setTimeout(step2, 0); } }] });
    const step2 = () => WK.modal({ title: WK.t('wizard.title'), body: (el) => el.append(head(2, WK.t('wizard.step2'), WK.t('wizard.step2Hint')),
      h('select.input', { 'data-test': 'wizard-day', onchange: (e) => { sessionDay = Number(e.target.value); } }, [0, 1, 2, 3, 4, 5, 6].map((d) => h('option', { value: d, selected: d === sessionDay ? true : null },
        new Intl.DateTimeFormat(WK.locale, { weekday: 'long' }).format(WK.parse(WK.addDays('2027-01-04', d))))))),
    actions: [{ label: WK.t('shell.back'), onClick: () => { setTimeout(step1, 0); } }, { label: WK.t('shell.next'), kind: 'primary', test: 'wizard-next', onClick: () => { setTimeout(step3, 0); } }] });
    const finish = (toLock) => {
      WK.update((s) => {
        s.emotionDefs.forEach((d) => { d.hidden = !keepE.has(d.id); });
        s.urgeDefs.forEach((d) => { d.hidden = !keepU.has(d.id); });
        s.settings.sessionDay = sessionDay;
      });
      WK.go(toLock ? 'settings' : 'today');
    };
    const step3 = () => WK.modal({ title: WK.t('wizard.title'), body: (el) => el.append(head(3, WK.t('wizard.step3'), WK.t('wizard.step3Hint'))),
      actions: [{ label: WK.t('wizard.lockLater'), test: 'wizard-done', onClick: () => finish(false) },
        WK.lock && WK.lock.available ? { label: WK.t('settings.lockEnable'), kind: 'primary', test: 'wizard-lock', onClick: () => finish(true) } : { label: WK.t('wizard.finish'), kind: 'primary', onClick: () => finish(false) }] });
    step1();
  }

  /* ---------- Today : démo et mention au premier lancement ---------- */
  WK.dc.beforeToday = (view) => {
    if (WK.state.demo) view.append(h('div.demo-banner', { 'data-test': 'demo-banner' }, WK.icon('leaf'), h('span', WK.t('demo.banner')),
      WK.btn(WK.t('demo.clear'), async () => { if (await WK.confirm(WK.t('shell.clearDemo'), WK.t('shell.clearDemoText'), WK.t('shell.clearDemo'))) WK.product.startFresh(true); }, { kind: 'ghost', test: 'today-clear-demo' })));
  };
  WK.route('today', (view, args) => {
    DC.renderToday(view, args);
    if (WK.state.demo || !WK.state.tourDone) view.append(h('p.notice', WK.t('notice')));
  });

  /* ---------- séquence vidéo (~10 s) : curseurs -> compétences -> enregistrer -> semaine -> préparation ---------- */
  WK.product.demoVideo = () => {
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const find = async (sel) => { for (let i = 0; i < 80; i++) { const e = document.querySelector(sel); if (e) return e; await wait(50); } return null; };
    const slide = async (test, to) => {
      const el = await find(`[data-test="${test}"]`); if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      for (let v = Number(el.value); v !== to; v += to > v ? 1 : -1) { el.value = String(v + (to > v ? 1 : -1)); el.dispatchEvent(new Event('input', { bubbles: true })); await wait(110); }
    };
    (async () => {
      delete WK.state.cards[WK.today()];
      WK.render(true);
      await find('[data-test="card-form"]'); await wait(700);
      await slide('emo-sadness', 2); await slide('emo-anxiety', 3); await slide('emo-joy', 2); await wait(200);
      await slide('urge-isolate', 2); await slide('urge-avoid', 1); await wait(250);
      for (const id of ['wise_mind', 'check_facts']) { const b = await find(`[data-skill="${id}"]`); if (b) { b.scrollIntoView({ block: 'center', behavior: 'smooth' }); await wait(350); b.click(); await wait(350); } }
      const save = await find('[data-test="save"]'); save.scrollIntoView({ block: 'center', behavior: 'smooth' }); await wait(500); save.click();
      await find('[data-test="card-summary"]'); window.scrollTo(0, 0); document.getElementById('main').scrollTop = 0; await wait(1500);
      WK.go('week'); await find('[data-test="week-grid"]'); await wait(2000);
      WK.go('week', DC.weekStartOf(WK.today()), 'prep'); await find('[data-test="prep"]'); await wait(1600);
      document.documentElement.dataset.videoDone = '1';
    })();
  };
})();

;
/* WellKept app_shell : lancement, toujours en dernier dans la liste des scripts. */
(function () {
  'use strict';
  const start = () => window.WK.boot().catch((e) => {
    console.error(e);
    document.getElementById('view').textContent = 'This app could not start: ' + (e && e.message);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
